name: Build Standalone Cadence APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bundle Web Assets into Android App
        run: |
          mkdir -p android/app/src/main/assets/css
          mkdir -p android/app/src/main/assets/js
          mkdir -p android/app/src/main/assets/icons
          cp index.html manifest.json android/app/src/main/assets/
          cp -r css/* android/app/src/main/assets/css/
          cp -r js/* android/app/src/main/assets/js/
          cp -r icons/* android/app/src/main/assets/icons/
          echo "Web assets successfully bundled into Android app!"

      - name: Accept Android SDK Licenses & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Cadence-Music.apk
          echo "Cadence-Music.apk ready for download!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Music-APK
          path: Cadence-Music.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          files: Cadence-Music.apk
          tag_name: v1.0.1
          name: "Cadence Music (Auto-Updating Android App)"
          body: |
            ## 🎵 Cadence Music Standalone Android APK (Auto-Updating)

            Download and install **Cadence-Music.apk** on your Android phone!
            
            - **Over-The-Air Automatic Updates**: Any updates you make on GitHub automatically appear in your app without reinstalling!
            - **100% Standalone**: Runs directly on your phone without relying on your PC or servers.
            - **Full Background Audio**: Immersive dark music deck, equalizer, and responsive vinyl turntable.
            - **Offline Storage**: Your liked tracks, custom playlists, and volume preferences are stored directly on your phone.
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
